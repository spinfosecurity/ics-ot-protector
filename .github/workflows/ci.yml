name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PowerShell tools
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -Scope CurrentUser -Force
      - name: Lint PowerShell
        shell: pwsh
        run: |
          Get-ChildItem scanners -Recurse -Filter *.ps1 | ForEach-Object {
            $t=$null;$e=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e)
            if($e.Count){throw "Parse error: $($_.FullName)"}
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning
          }
      - name: Run monorepo PowerShell tests
        shell: pwsh
        run: Invoke-Pester (Get-ChildItem -Path ./tests -Recurse -Filter *.Tests.ps1) -CI -Output Detailed
      - name: Run monorepo Bash tests
        shell: bash
        run: |
          bash tests/shared/bash/repository_tests.sh
          bash tests/water/bash/repository_tests.sh
          bash tests/water/bash/behavioral_tests.sh
          bash tests/energy-grid/bash/repository_tests.sh
          bash tests/bas/bash/repository_tests.sh
          bash tests/rail/bash/repository_tests.sh
      - name: Confirm project files
        shell: bash
        run: |
          test -f CHANGELOG.md && test -f CODE_OF_CONDUCT.md && test -f docs/safe-operation.md && test -f docs/threat-model.md && test -f docs/sample-report.md
          test -d scanners/water && test -d scanners/energy-grid && test -d scanners/bas && test -d scanners/rail
